name: Streamlit 自动唤醒

on:
  workflow_dispatch:
  repository_dispatch:
    types: [service-down-alert]
  # schedule:
  #   - cron: '0 0 * * *' # 每天运行

jobs:
  wakeup:
    runs-on: ubuntu-latest

    steps:
      - name: 检查触发事件
        run: |
          echo "Workflow triggered by: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "触发事件类型 (Event Type): ${{ github.event.action }}"
          fi

      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Chromium
        uses: browser-actions/setup-chromium@v2
        
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f "keep/requirements.txt" ]; then
            pip install -r keep/requirements.txt
          else
            pip install selenium webdriver-manager
          fi

      - name: 执行 Streamlit 唤醒脚本
        env:
          # 兼容：优先从 Variables (公开) 读取，若没有则从 Secrets (加密) 读取
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL || secrets.PROJECT_URL }}
        run: |
          echo "🔍 正在检查环境变量注入情况..."
          echo "STREAMLIT_APP_URL 字符长度: ${#STREAMLIT_APP_URL}"
          
          if [ -z "$STREAMLIT_APP_URL" ] && [ -z "$PROJECT_URL" ]; then
            echo "❌ 错误: 环境变量仍然为空！"
            echo "请在 GitHub 设置中，要么在 'Secrets' 里填写，要么在 'Variables' 里填写 STREAMLIT_APP_URL。"
            exit 1
          fi
          
          python keep/streamlit-keep.py
